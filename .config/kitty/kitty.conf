#: SHELL
shell /usr/bin/bash
shell_integration no-cursor

#: KEYBOARD SHORTCUTS
kitty_mod ctrl+shift
map kitty_mod+f11 toggle_fullscreen
map kitty_mod+f10 toggle_maximized

#: WINDOW
window_padding_width 10
window_margin_width 5
window_border_width 1.5pt
hide_window_decorations no

##: BACKGROUND
background_opacity 0.97

##: LAYOUTS
enabled_layouts tall
active_border_color #98971a
inactive_border_color #928374

##: TAB
tab_bar_style powerline
tab_powerline_style angled
tab_activity_symbol *

#: CURSOR
cursor_shape block
cursor_blink_interval 1

##: SCROLLING / SCROLLBACK
scrollbar never
scrollback_lines 10000
scrollback_pager_history_size 10000
wheel_scroll_multiplier 3.0

#: FONTS
font_size 14.0
font_family      Fira Code Nerd Font Mono
bold_font        Fira Code Nerd Font Mono Bold
italic_font      Fira Code Nerd Font Mono Italic
bold_italic_font Fira Code Nerd Font Mono Bold Italic

#: TERMINAL THEME
# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME
